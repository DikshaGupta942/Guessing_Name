<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1>🎯 Number Guessing Game</h1>
            <p>Welcome to the exciting number guessing challenge!</p>
            
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Enter your name" maxlength="50">
                <button onclick="startGame()">Start Game</button>
            </div>
            
            <div id="error" class="error-message"></div>
            
            <div class="game-rules">
                <h3>How to Play:</h3>
                <ul>
                    <li>Guess a number between 1 and 100</li>
                    <li>You'll get hints if your guess is too high or too low</li>
                    <li>Try to guess in the fewest attempts!</li>
                    <li>Type 'q' at any time to quit</li>
                </ul>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
